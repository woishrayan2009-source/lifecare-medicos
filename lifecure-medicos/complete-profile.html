<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Complete Your Profile — LifeCure Medicos</title>
  <meta name="description" content="Complete your profile to continue" />
  <meta name="robots" content="noindex, nofollow" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #1a6b4a 0%, #2d8f63 100%);
      min-height: 100vh;
      padding: 24px;
    }

    .profile-container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .profile-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .profile-header h1 {
      font-size: 28px;
      font-weight: 700;
      color: #1a6b4a;
      margin-bottom: 8px;
    }

    .profile-header p {
      font-size: 14px;
      color: #666;
    }

    .progress-bar {
      height: 6px;
      background: #e0e0e0;
      border-radius: 3px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #1a6b4a 0%, #2d8f63 100%);
      width: 0%;
      transition: width 0.3s ease;
    }

    .form-section {
      margin-bottom: 28px;
    }

    .form-section h3 {
      font-size: 16px;
      font-weight: 600;
      color: #1c1c1c;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-section h3 i {
      color: #1a6b4a;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-grid.full {
      grid-template-columns: 1fr;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 14px;
      font-weight: 600;
      color: #1c1c1c;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      padding: 12px 14px;
      border: 1.5px solid #e0e0e0;
      border-radius: 10px;
      font-size: 14px;
      font-family: 'Poppins', sans-serif;
      transition: all 0.2s;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #1a6b4a;
      box-shadow: 0 0 0 3px rgba(26, 107, 74, 0.1);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .photo-upload {
      border: 2px dashed #1a6b4a;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }

    .photo-upload:hover {
      background: #f8fffe;
    }

    .photo-upload input[type="file"] {
      display: none;
    }

    .photo-preview {
      width: 120px;
      height: 120px;
      border-radius: 12px;
      background: #e8f5e9;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
      font-size: 48px;
      color: #1a6b4a;
      overflow: hidden;
    }

    .photo-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo-upload-text {
      color: #666;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .photo-upload-hint {
      color: #999;
      font-size: 12px;
    }

    .checkbox-group {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #1a6b4a;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .checkbox-group label {
      cursor: pointer;
      font-size: 14px;
      line-height: 1.5;
    }

    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 32px;
    }

    .btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Poppins', sans-serif;
    }

    .btn-save {
      background: linear-gradient(135deg, #1a6b4a 0%, #2d8f63 100%);
      color: white;
    }

    .btn-save:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(26, 107, 74, 0.3);
    }

    .btn-skip {
      background: #f0f0f0;
      color: #666;
    }

    .btn-skip:hover {
      background: #e0e0e0;
    }

    .error-message {
      background: #ffebee;
      color: #c62828;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
      font-size: 14px;
      border-left: 4px solid #c62828;
    }

    .error-message.show {
      display: block;
    }

    .success-message {
      background: #e8f5e9;
      color: #2e7d32;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
      font-size: 14px;
      border-left: 4px solid #2e7d32;
    }

    .success-message.show {
      display: block;
    }

    @media (max-width: 600px) {
      .profile-container {
        padding: 24px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .button-group {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <div class="profile-container">

    <div class="profile-header">
      <h1>Complete Your Profile</h1>
      <p>Just a few more details to get started</p>
    </div>

    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div id="errorMessage" class="error-message"></div>
    <div id="successMessage" class="success-message"></div>

    <form id="profileForm">

      <!-- Basic Info Section -->
      <div class="form-section">
        <h3><i class="fas fa-user"></i> Basic Information</h3>
        <div class="form-grid">
          <div class="form-group">
            <label for="name">Full Name *</label>
            <input type="text" id="name" name="name" placeholder="Your full name" required />
          </div>
          <div class="form-group">
            <label for="phone">Phone Number *</label>
            <input type="tel" id="phone" name="phone" placeholder="10-digit number" pattern="[0-9]{10}" required />
          </div>
        </div>
      </div>

      <!-- Health Info Section -->
      <div class="form-section">
        <h3><i class="fas fa-heart"></i> Health Information</h3>
        <div class="form-grid">
          <div class="form-group">
            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" name="dob" />
          </div>
          <div class="form-group">
            <label for="gender">Gender</label>
            <select id="gender" name="gender">
              <option value="">Select Gender</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label for="bloodGroup">Blood Group</label>
            <select id="bloodGroup" name="bloodGroup">
              <option value="">Select Blood Group</option>
              <option value="O+">O+</option>
              <option value="O-">O-</option>
              <option value="A+">A+</option>
              <option value="A-">A-</option>
              <option value="B+">B+</option>
              <option value="B-">B-</option>
              <option value="AB+">AB+</option>
              <option value="AB-">AB-</option>
            </select>
          </div>
          <div class="form-group">
            <label for="allergies">Allergies</label>
            <input type="text" id="allergies" name="allergies" placeholder="e.g., Penicillin, Peanuts" />
          </div>
        </div>
        <div class="form-grid full">
          <div class="form-group">
            <label for="diseases">Existing Medical Conditions</label>
            <textarea id="diseases" name="diseases" placeholder="List any existing conditions (Diabetes, Hypertension, etc.)"></textarea>
          </div>
        </div>
      </div>

      <!-- Address Section -->
      <div class="form-section">
        <h3><i class="fas fa-map-location-dot"></i> Address</h3>
        <div class="form-grid full">
          <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="address" name="address" placeholder="Street address" />
          </div>
        </div>
        <div class="form-grid">
          <div class="form-group">
            <label for="city">City</label>
            <input type="text" id="city" name="city" placeholder="City" />
          </div>
          <div class="form-group">
            <label for="state">State</label>
            <input type="text" id="state" name="state" placeholder="State" />
          </div>
          <div class="form-group">
            <label for="pincode">Pincode</label>
            <input type="text" id="pincode" name="pincode" placeholder="6-digit pincode" pattern="[0-9]{6}" />
          </div>
        </div>
      </div>

      <!-- Emergency Contact Section -->
      <div class="form-section">
        <h3><i class="fas fa-phone"></i> Emergency Contact</h3>
        <div class="form-grid full">
          <div class="form-group">
            <label for="emergencyContact">Emergency Contact Phone Number</label>
            <input type="tel" id="emergencyContact" name="emergencyContact" placeholder="10-digit number" pattern="[0-9]{10}" />
          </div>
        </div>
      </div>

      <!-- Photo Upload Section -->
      <div class="form-section">
        <h3><i class="fas fa-camera"></i> Profile Photo</h3>
        <div class="photo-upload" onclick="document.getElementById('photoInput').click()">
          <div class="photo-preview" id="photoPreview">
            <i class="fas fa-user"></i>
          </div>
          <div class="photo-upload-text">Click to upload your photo</div>
          <div class="photo-upload-hint">JPG, PNG up to 5MB</div>
          <input type="file" id="photoInput" accept="image/*" />
        </div>
      </div>

      <!-- Terms -->
      <div class="form-section">
        <div class="checkbox-group">
          <input type="checkbox" id="terms" name="terms" required />
          <label for="terms">
            I agree to share my health information for medical consultation and emergency purposes
          </label>
        </div>
      </div>

      <div class="button-group">
        <button type="button" class="btn btn-skip" onclick="skipProfileCompletion()">
          Skip for Now
        </button>
        <button type="submit" class="btn btn-save" id="saveBtn">
          <i class="fas fa-check"></i> Complete Profile
        </button>
      </div>

    </form>

  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-storage.js"></script>

  <!-- Config & Auth -->
  <script src="assets/js/firebase-config.js"></script>
  <script src="assets/js/auth.js"></script>

  <script>
    const { auth, db, storage } = window.firebaseServices;
    const form = document.getElementById('profileForm');
    const errorMessage = document.getElementById('errorMessage');
    const successMessage = document.getElementById('successMessage');
    const saveBtn = document.getElementById('saveBtn');
    const photoInput = document.getElementById('photoInput');
    const photoPreview = document.getElementById('photoPreview');
    const progressFill = document.getElementById('progressFill');

    let photoFile = null;

    // Load existing profile data
    async function loadProfileData() {
      const userId = getCurrentUserId();
      if (!userId) return;

      const userDoc = await db.collection('users').doc(userId).get();
      const data = userDoc.data();

      if (data) {
        document.getElementById('name').value = data.name || '';
        document.getElementById('phone').value = data.phone || '';
        document.getElementById('dob').value = data.dob || '';
        document.getElementById('gender').value = data.gender || '';
        document.getElementById('bloodGroup').value = data.bloodGroup || '';
        document.getElementById('allergies').value = data.allergies || '';
        document.getElementById('diseases').value = data.diseases || '';
        document.getElementById('address').value = data.address || '';
        document.getElementById('city').value = data.city || '';
        document.getElementById('state').value = data.state || '';
        document.getElementById('pincode').value = data.pincode || '';
        document.getElementById('emergencyContact').value = data.emergencyContact || '';

        if (data.photoURL) {
          photoPreview.innerHTML = `<img src="${data.photoURL}" alt="Profile" />`;
        }
      }
    }

    // Photo preview
    photoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file && file.size <= 5 * 1024 * 1024) {
        photoFile = file;
        const reader = new FileReader();
        reader.onload = (event) => {
          photoPreview.innerHTML = `<img src="${event.target.result}" alt="Preview" />`;
        };
        reader.readAsDataURL(file);
      } else {
        errorMessage.textContent = 'File must be less than 5MB';
        errorMessage.classList.add('show');
      }
    });

    // Update progress
    form.addEventListener('change', updateProgress);
    form.addEventListener('input', updateProgress);

    function updateProgress() {
      const fields = form.querySelectorAll('input:not([type="checkbox"]), select, textarea');
      const filledFields = Array.from(fields).filter(field => field.value.trim() !== '').length;
      const progress = (filledFields / fields.length) * 100;
      progressFill.style.width = Math.min(progress, 100) + '%';
    }

    // Form submission
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const userId = getCurrentUserId();
      if (!userId) {
        errorMessage.textContent = 'Please log in first';
        errorMessage.classList.add('show');
        return;
      }

      saveBtn.disabled = true;
      saveBtn.innerHTML = '<span style="display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: white; animation: spin 0.8s linear infinite; margin-right: 8px;"></span> Saving...';
      errorMessage.classList.remove('show');
      successMessage.classList.remove('show');

      try {
        let photoURL = null;

        // Upload photo if selected
        if (photoFile) {
          const storageRef = storage.ref(`profiles/${userId}/${photoFile.name}`);
          await storageRef.put(photoFile);
          photoURL = await storageRef.getDownloadURL();
        }

        // Update user profile
        const updateData = {
          name: document.getElementById('name').value,
          phone: document.getElementById('phone').value,
          dob: document.getElementById('dob').value,
          gender: document.getElementById('gender').value,
          bloodGroup: document.getElementById('bloodGroup').value,
          allergies: document.getElementById('allergies').value,
          diseases: document.getElementById('diseases').value,
          address: document.getElementById('address').value,
          city: document.getElementById('city').value,
          state: document.getElementById('state').value,
          pincode: document.getElementById('pincode').value,
          emergencyContact: document.getElementById('emergencyContact').value,
          profileCompleted: true
        };

        if (photoURL) {
          updateData.photoURL = photoURL;
        }

        await db.collection('users').doc(userId).update(updateData);

        successMessage.textContent = 'Profile completed successfully! Redirecting...';
        successMessage.classList.add('show');

        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1500);

      } catch (error) {
        console.error('Save error:', error);
        errorMessage.textContent = 'Error saving profile: ' + error.message;
        errorMessage.classList.add('show');
        saveBtn.disabled = false;
        saveBtn.innerHTML = '<i class="fas fa-check"></i> Complete Profile';
      }
    });

    async function skipProfileCompletion() {
      const userId = getCurrentUserId();
      if (!userId) return;

      try {
        // Mark profile as completed anyway
        await db.collection('users').doc(userId).update({
          profileCompleted: true
        });
        window.location.href = 'dashboard.html';
      } catch (error) {
        console.error('Skip error:', error);
      }
    }

    // Initialize on load
    window.addEventListener('load', loadProfileData);
  </script>

</body>
</html>
