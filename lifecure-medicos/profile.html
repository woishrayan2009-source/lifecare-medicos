<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile — LifeCure Medicos</title>
  <meta name="description" content="View and manage your profile" />
  <meta name="robots" content="noindex, nofollow" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <link rel="stylesheet" href="assets/css/profile.css" />
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="dashboard.html" class="nav-back">
        <i class="fas fa-arrow-left"></i> Back to Dashboard
      </a>
      <h1 class="nav-title">My Profile</h1>
      <button class="nav-logout" onclick="handleLogout()">
        <i class="fas fa-sign-out-alt"></i> Logout
      </button>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container">

    <!-- Profile Header -->
    <div class="profile-header">
      <div class="profile-photo" id="profilePhotoDisplay">
        <i class="fas fa-user"></i>
      </div>
      <h2 id="profileName">User Profile</h2>
      <p id="profileEmail">user@example.com</p>
    </div>

    <!-- Error & Success Messages -->
    <div id="errorMessage" class="alert alert-error"></div>
    <div id="successMessage" class="alert alert-success"></div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="personal" onclick="switchTab('personal')">
        <i class="fas fa-user"></i> Personal Info
      </button>
      <button class="tab-btn" data-tab="health" onclick="switchTab('health')">
        <i class="fas fa-heart"></i> Health Info
      </button>
      <button class="tab-btn" data-tab="address" onclick="switchTab('address')">
        <i class="fas fa-map-pin"></i> Address
      </button>
      <button class="tab-btn" data-tab="emergency" onclick="switchTab('emergency')">
        <i class="fas fa-phone"></i> Emergency
      </button>
    </div>

    <form id="profileForm">

      <!-- Personal Info Tab -->
      <div class="tab-content active" id="tab-personal">
        <div class="form-section">
          <h3><i class="fas fa-user"></i> Personal Information</h3>
          <div class="form-grid">
            <div class="form-group">
              <label for="name">Full Name *</label>
              <input type="text" id="name" required />
            </div>
            <div class="form-group">
              <label for="email">Email Address</label>
              <input type="email" id="email" disabled />
              <small style="color: #999;">Email cannot be changed</small>
            </div>
            <div class="form-group">
              <label for="phone">Phone Number *</label>
              <input type="tel" id="phone" pattern="[0-9]{10}" required />
            </div>
          </div>
        </div>

        <div class="form-section">
          <h3><i class="fas fa-camera"></i> Profile Photo</h3>
          <div class="photo-upload" onclick="document.getElementById('photoInput').click()">
            <div class="photo-preview" id="photoPreview">
              <i class="fas fa-user"></i>
            </div>
            <div class="photo-text">Click to change photo</div>
            <small>JPG, PNG up to 5MB</small>
            <input type="file" id="photoInput" accept="image/*" style="display: none;" />
          </div>
        </div>
      </div>

      <!-- Health Info Tab -->
      <div class="tab-content" id="tab-health">
        <div class="form-section">
          <h3><i class="fas fa-heart"></i> Health Information</h3>
          <div class="form-grid">
            <div class="form-group">
              <label for="dob">Date of Birth</label>
              <input type="date" id="dob" />
            </div>
            <div class="form-group">
              <label for="gender">Gender</label>
              <select id="gender">
                <option value="">Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div class="form-group">
              <label for="bloodGroup">Blood Group</label>
              <select id="bloodGroup">
                <option value="">Select Blood Group</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
              </select>
            </div>
          </div>

          <div class="form-grid full">
            <div class="form-group">
              <label for="allergies">Allergies</label>
              <input type="text" id="allergies" placeholder="e.g., Penicillin, Peanuts" />
            </div>
          </div>

          <div class="form-grid full">
            <div class="form-group">
              <label for="diseases">Medical Conditions</label>
              <textarea id="diseases" placeholder="List any existing conditions"></textarea>
            </div>
          </div>
        </div>
      </div>

      <!-- Address Tab -->
      <div class="tab-content" id="tab-address">
        <div class="form-section">
          <h3><i class="fas fa-map-pin"></i> Address</h3>
          <div class="form-grid full">
            <div class="form-group">
              <label for="address">Address</label>
              <input type="text" id="address" placeholder="Street address" />
            </div>
          </div>

          <div class="form-grid">
            <div class="form-group">
              <label for="city">City</label>
              <input type="text" id="city" placeholder="City" />
            </div>
            <div class="form-group">
              <label for="state">State</label>
              <input type="text" id="state" placeholder="State" />
            </div>
            <div class="form-group">
              <label for="pincode">Pincode</label>
              <input type="text" id="pincode" placeholder="6-digit pincode" pattern="[0-9]{6}" />
            </div>
          </div>
        </div>
      </div>

      <!-- Emergency Tab -->
      <div class="tab-content" id="tab-emergency">
        <div class="form-section">
          <h3><i class="fas fa-phone"></i> Emergency Contact</h3>
          <div class="form-grid full">
            <div class="form-group">
              <label for="emergencyContact">Emergency Contact Phone Number</label>
              <input type="tel" id="emergencyContact" placeholder="10-digit number" pattern="[0-9]{10}" />
            </div>
          </div>
        </div>
      </div>

      <!-- Save Button -->
      <div class="form-actions">
        <button type="submit" class="btn-save">
          <i class="fas fa-save"></i> Save Changes
        </button>
        <button type="button" class="btn-cancel" onclick="goBackToDashboard()">
          Cancel
        </button>
      </div>

    </form>

  </div>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2026 LifeCure Medicos. All rights reserved.</p>
  </footer>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-storage-compat.js"></script>

  <!-- Config & Auth -->
  <script src="assets/js/firebase-config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/profile.js"></script>

</body>
</html>
